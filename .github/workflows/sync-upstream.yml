name: Sync MoonTVPlus Upstream

on:
  workflow_dispatch:

  schedule:
    # 台灣時間每月 1 日上午 10:17
    # GitHub Actions cron 使用 UTC，因此 02:17 UTC = 台灣 10:17
    - cron: '17 2 1 * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking upstream updates..."

          gh api \
            --method POST \
            /repos/${{ github.repository }}/merge-upstream \
            -f branch=main
